spring.application.name=fundoo-notes
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fundoo_notes
spring.datasource.username=root
spring.datasource.password=${FUNDOO_DB_PASSWORD:}
spring.config.import=optional:file:./application-local.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
fundoo.jwt.secret=${FUNDOO_JWT_SECRET:}
fundoo.cors.allowed-origins=${FUNDOO_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
