spring.application.name=fundoo-notes-test
spring.datasource.url=jdbc:h2:mem:fundoo_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
fundoo.jwt.secret=${FUNDOO_JWT_SECRET:}
fundoo.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
